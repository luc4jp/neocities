<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clips - luca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Left Sidebar (Loaded via JS) -->
        <div id="sidebar-container" class="sidebar"></div>

        <!-- Right Main Content -->
        <div class="window-box main-content">
            <!-- Decorative Header -->
            <div id="header-container"></div>

            <h1>Clips / 映像</h1>
            <p>Here you can watch my cinematic videos about Hiroshima and Japanese culture.</p>

            <hr>

            <h2>Instagram Reels</h2>
            <p>Cinematic Hiroshima landscapes and daily life.</p>

            <!-- Favorite Reels (Direct Iframe Embed) -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px;">
                <div style="background: var(--lilac-sub-bg); padding: 10px; border: 1.5px solid var(--lilac-border); max-height: 480px; overflow: hidden;">
                    <iframe src="https://www.instagram.com/reel/DYNKdUeJFsr/embed" width="100%" height="480" frameborder="0"
                        scrolling="no" allowtransparency="true"></iframe>
                </div>
                <div style="background: var(--lilac-sub-bg); padding: 10px; border: 1.5px solid var(--lilac-border); max-height: 480px; overflow: hidden;">
                    <iframe src="https://www.instagram.com/reel/DbIV7TEJ0ZN/embed" width="100%" height="480" frameborder="0"
                        scrolling="no" allowtransparency="true"></iframe>
                </div>
            </div>

            <h2>YouTube Videos</h2>
            <p>In-depth explanations of Japanese culture and Hiroshima spots.</p>

            <!-- YouTube Embed -->
            <div style="background: var(--lilac-sub-bg); padding: 14px; border: 1.5px solid var(--lilac-border); margin-bottom: 28px;">
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/OlgSBfp1vMo"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <p style="text-align: center; margin-top: 40px;">
                <a href="home.html">← Back to Top</a>
            </p>

        </div> 
    </div> 


</body>
    <div id="footer-container"></div>

<script src="load_components.js" defer></script></html>
