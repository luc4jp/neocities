<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="https://luc4jp.neocities.org/images/resources/favicon.ico?v=1" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos by luc4__jp</title>
    <link rel="stylesheet" href="/style.css?v=1">
    <style>
        .album-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-top: 20px;
        }

        .album-card {
            background-color: #ffffff;
            border: 1px solid var(--border-color, #e0e0e0);
            border-radius: 8px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .album-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
        }

        .album-cover {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #f5f5f5;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .album-info {
            margin-top: 14px;
        }

        .album-title {
            font-weight: bold;
            font-size: 20px;
            display: block;
            color: var(--text-color, #333);
        }

        .album-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
            display: block;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .album-grid {
                grid-template-columns: 1fr;
            }
            .album-cover {
                height: 200px;
            }
        }

        body.dark-theme .album-card {
            background-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body style="background-image: url('/images/resources/bg/murasaki_moro.gif'); background-repeat: repeat; background-attachment: fixed;">
    <div class="container">
        <div id="sidebar-container" class="sidebar"></div>

        <div class="window-box main-content" style="background-color: var(--lilac-card); border-style: solid; border-width: 12px; border-image-source: url('/images/resources/table/siro_lace4.gif'); border-image-slice: 30%; border-image-width: 24px; border-image-outset: 6px; border-image-repeat: round; padding: 20px; box-sizing: border-box;">

            <h1 style="font-family: 'gothic', sans-serif; font-size: 55px; font-weight: normal; letter-spacing: 2px; line-height: 1; margin: 0 0 -10px 0;">Photos</h1>
            <p style="margin: 0;">
                Snapshots, food & daily life memories<br>
                <span class="lang-jp" style="font-size: 15px; color: var(--text-muted);">スナップ、ごはん、日々の記録</span>
            </p>

            <div style="background: url('/images/resources/div/lace.gif') repeat-x center / auto 100%; height: 24px; margin: 16px 0; width: 100%; -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent); mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);"></div>

            <section style="margin-bottom: 30px;">
                <h2 style="font-size: 20px; border-bottom: 1px dashed var(--border-color, #ccc); padding-bottom: 4px; margin-bottom: 16px;">
                    Albums
                </h2>

                <div class="album-grid">

                    <a href="/photos/snap/" class="album-card">
                        <img src="/photos/snap/humikiri.png" alt="Snap & Scenery" class="album-cover">
                        <div class="album-info">
                            <span class="album-title">Snap & Scenery</span>
                            <span class="lang-jp album-desc">散歩、風景、外出の記録</span>
                        </div>
                    </a>

                    <a href="/photos/food" class="album-card">
                        <img src="/photos/food/nagasaki_kaisen.png" alt="Food & Cafe" class="album-cover">
                        <div class="album-info">
                            <span class="album-title">Food & Cafe</span>
                            <span class="lang-jp album-desc">ごはん、カフェ、おやつの記録</span>
                        </div>
                    </a>

                    <a href="/photos/life/" class="album-card">
                        <img src="/photos/life/kinogassa.jpg" alt="Life & Favorite Things" class="album-cover">
                        <div class="album-info">
                            <span class="album-title">Life & Favorite Things</span>
                            <span class="lang-jp album-desc">買ったもの、お気に入りの記録</span>
                        </div>
                    </a>

                </div>
            </section>

            <footer>
                <p style="text-align: center; margin-top: 40px;">
                    <a href="/index.html">← Back to Top Page</a>
                </p>
            </footer>

        </div>
    </div>

    <div id="footer-container"></div>
    <script src="/load_components.js"></script>
</body>

</html>
