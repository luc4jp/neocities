<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="https://luc4jp.neocities.org/images/resources/favicon.ico?v=1" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food - Photos by luc4__jp</title>
    <link rel="stylesheet" href="/style.css?v=1">
    <style>
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-top: 20px;
        }

        .photo-card {
            background-color: #ffffff;
            border: 1px solid var(--border-color, #e0e0e0);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .photo-img {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            border-radius: 4px;
            background-color: #f5f5f5;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .photo-meta {
            margin-top: 10px;
            padding: 0 4px;
        }

        .photo-date {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-heading);
            display: block;
        }

        .photo-caption {
            font-size: 14px;
            margin-top: 4px;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            .photo-grid {
                grid-template-columns: 1fr;
            }
            .photo-img {
                max-height: 350px;
            }
        }

        body.dark-theme .photo-card {
            background-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body style="background-image: url('/images/resources/bg/murasaki_moro.gif'); background-repeat: repeat; background-attachment: fixed;">
    <div class="container">
        <div id="sidebar-container" class="sidebar"></div>

        <div class="window-box main-content" style="background-color: var(--lilac-card); border-style: solid; border-width: 12px; border-image-source: url('/images/resources/table/siro_lace4.gif'); border-image-slice: 30%; border-image-width: 24px; border-image-outset: 6px; border-image-repeat: round; padding: 20px; box-sizing: border-box;">

            <h1 style="font-family: 'gothic', sans-serif; font-size: 55px; font-weight: normal; letter-spacing: 2px; line-height: 1; margin: 0 0 -10px 0;">Food</h1>
            <p style="margin: 0;">
                My meal<br>
                <span class="lang-jp" style="font-size: 15px; color: var(--text-muted);">ご飯とかカフェとか</span>
            </p>

            <div style="background: url('/images/resources/div/lace.gif') repeat-x center / auto 100%; height: 24px; margin: 16px 0; width: 100%; -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent); mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);"></div>

            <section style="margin-bottom: 30px;">

                <div class="photo-grid">

                    <div class="photo-card">
                        <img src="/photos/food/nagasaki_kaisen.png" alt="長崎の海鮮居酒屋" class="photo-img" loading="lazy">
                        <div class="photo-meta">
                            <span class="photo-date">2025.03.09</span>
                            <div class="photo-caption">
                                <span class="lang-jp">長崎の駅にある安くて美味い海鮮居酒屋</span>
                            </div>
                        </div>
                    </div>

                </div>

            </section>

            <footer>
                <p style="text-align: center; margin-top: 40px;">
                    <a href="/photos/index.html">← Back to Photos Index</a>
                </p>
            </footer>

        </div>
    </div>

    <div id="footer-container"></div>
    <script src="/load_components.js"></script>
</body>

</html>
